<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Count Search</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            padding-bottom: 40px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: #f1f1f1;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.1);
        }

        .footer img {
            width: 50px;
            height: auto;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Inventory Count Search</h2>

    <!-- Dropdown Filters -->
    <div class="row mb-4">
        <div class="col-md-3">
            <label for="blockSelect"><b>Select Block</b></label>
            <select id="blockSelect" class="form-control">
                <option value="">All Blocks</option>
                <option value="B1">Block 1</option>
                <option value="B2">Block 2</option>
                <option value="B3">Block 3</option>
                <option value="B4">Block 4</option>
                <option value="B5">Block 5</option>
                <option value="B6">Block 6</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="floorSelect"><b>Select Floor</b></label>
            <select id="floorSelect" class="form-control">
                <option value="">All Floors</option>
                <option value="GF">GROUND FLOOR</option>
                <option value="1F">FIRST FLOOR</option>
                <option value="2F">SECOND FLOOR</option>
                <option value="3F">THIRD FLOOR</option>
                <option value="4F">FOURTH FLOOR</option>
                <option value="5F">FIFTH FLOOR</option>
                <option value="6F">SIXTH FLOOR</option>
                <option value="TF">TERRACE FLOOR</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="descSelect"><b>Select Description</b></label>
            <select id="descSelect" class="form-control">
                <option value="">All Descriptions</option>
                <option value="WALL">WALL</option>
                <option value="CLADDING WALL">CLADDING WALL</option>
                <option value="SOLID SLAB">SOLID SLAB</option>
                <option value="COLUMN">COLUMN</option>
                <option value="BEAM">BEAM</option>
                <option value="STAIRCASE">STAIRCASE</option>
                <option value="PARAPET">PARAPET</option>
            </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button id="searchBtn" class="btn btn-primary btn-block">Search</button>
        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>S.No</th>
                <th>Count Type</th>
                <th>Original Count</th>
                <th>Filtered Total Qty</th>
            </tr>
            </thead>
            <tbody id="countTable">
            <!-- Will be replaced by AJAX -->
            </tbody>
        </table>
    </div>
</div>

<footer class="footer">
    <span><b>SEGMENT TRACKING SYSTEM</b></span>
    <img th:src="@{/images/paramount1.jpg}" alt="Logo 2">
</footer>

<script>
    $(document).ready(function () {
        $('#searchBtn').on('click', function () {
            const block = $('#blockSelect').val();
            const floor = $('#floorSelect').val();
            const description = $('#descSelect').val();

            const requestData = {
                block: block,
                floor: floor,
                description: description
            };

            $.ajax({
                url: '/hostelOD/api/getCounts',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestData),
                success: function (response) {
                    if (Array.isArray(response)) {
                        $('#countTable').empty(); // Clear previous rows

                        response.forEach((item, index) => {
                            const row = `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td>${item.type}</td>
                                    <td>${item.count}</td>
                                    <td>${item.totalQty}</td>
                                </tr>
                            `;
                            $('#countTable').append(row);
                        });
                    } else {
                        alert("Unexpected response format from server.");
                    }
                },
                error: function (xhr, status, error) {
                    console.error("AJAX Error:", error);
                    alert("Error fetching data.");
                }
            });
        });
    });
</script>

</body>
</html>
